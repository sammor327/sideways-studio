<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sideways Studio: Score Bug</title>
<link rel="stylesheet" href="/assets/brand.css">
<link rel="stylesheet" href="/theme/fonts.css">
<link rel="stylesheet" href="/stage/stage.css">
<link rel="stylesheet" href="./scene.css">
</head>
<body>
<div class="stage">
  <div class="bug off" id="bug">
    <div class="side left">
      <div class="plate name-plate" style="--d:0.05"><span id="lname"></span></div>
      <div class="plate score-plate" style="--d:0.18"><span class="score" id="lscore">0</span></div>
      <div class="ticks" id="lticks" style="--d:0.3"></div>
    </div>
    <div class="mid" style="--d:0"><div class="mid-bar"></div></div>
    <div class="side right">
      <div class="ticks" id="rticks" style="--d:0.3"></div>
      <div class="plate score-plate" style="--d:0.18"><span class="score" id="rscore">0</span></div>
      <div class="plate name-plate" style="--d:0.05"><span id="rname"></span></div>
    </div>
  </div>
  <div class="stage-diag" id="diag">Sideways Studio: waiting for the control panel server…</div>
  <div class="stage-diag" id="hiddenHint">Score bug is hidden: switch it on and press TAKE in the control panel. (This hint never appears on the transparent broadcast URL.)</div>
</div>
<script type="module" src="./scene.js"></script>
</body>
</html>
