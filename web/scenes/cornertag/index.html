<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sideways Studio: Corner Tag</title>
<link rel="icon" href="/assets/favicon.ico">
<link rel="stylesheet" href="/assets/brand.css">
<link rel="stylesheet" href="/theme/fonts.css">
<link rel="stylesheet" href="/stage/stage.css">
<link rel="stylesheet" href="/stage/kit.css">
<link rel="stylesheet" href="./scene.css">
</head>
<body>
<div class="stage">
  <div class="cornertag off" id="root">
    <div class="tag" id="tag">
      <div class="k" id="key">Up next</div>
      <div class="v"><span class="main" id="main"></span><small id="sub"></small></div>
      <div class="clock" id="clock">00:00</div>
    </div>
  </div>
  <div class="stage-diag" id="diag">Sideways Studio: waiting for the control panel server…</div>
  <div class="stage-diag" id="hiddenHint">The corner tag is hidden: switch it on and press TAKE in the control panel. (This hint never appears on the transparent broadcast URL.)</div>
</div>
<script type="module" src="./scene.js"></script>
</body>
</html>
