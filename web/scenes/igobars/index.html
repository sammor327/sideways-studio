<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sideways Studio: In-Game Overlay, 2v2 Bars</title>
<link rel="icon" href="/assets/favicon.ico">
<link rel="stylesheet" href="/assets/brand.css">
<link rel="stylesheet" href="/theme/fonts.css">
<link rel="stylesheet" href="/stage/stage.css">
<link rel="stylesheet" href="/stage/ground.css">
<link rel="stylesheet" href="./scene.css">
</head>
<body>
<div class="stage">
  <div class="bars off mode-legend" id="bars">

    <!-- Top bar: team 1 (the P1 side). Player 1 at the left corner with the
         left legend tile, the teammate at the right corner with the right
         tile, the team camera between them, the score on its lower edge. -->
    <div class="bar top" id="tbar">
      <div class="bar-bg">
        <div class="ground">
          <div class="g-fill"></div><div class="g-image"></div>
          <div class="g-shards"></div><div class="g-shade"></div><div class="g-glint"></div>
          <div class="g-grain"></div><div class="g-dim"></div>
        </div>
        <div class="rule"></div>
      </div>
      <span class="pname p1" id="t1name"></span>
      <span class="pname p2" id="t2name"></span>

      <div class="tile a">
        <img class="art hidden" id="t1legendImg" alt="" draggable="false">
        <div class="tile-cap">
          <span class="cap-legend" id="t1legend"></span>
          <div class="cap-rule"></div>
          <span class="cap-champ" id="t1champ"></span>
        </div>
        <div class="orn"></div>
      </div>
      <div class="cam" id="tcam">
        <div class="cam-fill"></div>
        <div class="hero-slot">
          <img class="art hidden" id="t1hero" alt="" draggable="false">
          <div class="cam-chip" id="t1chip"></div>
        </div>
        <div class="hero-slot">
          <img class="art hidden" id="t2hero" alt="" draggable="false">
          <div class="cam-chip" id="t2chip"></div>
        </div>
      </div>
      <div class="cam-edge"></div>
      <div class="tile b">
        <img class="art hidden" id="t2legendImg" alt="" draggable="false">
        <div class="tile-cap">
          <span class="cap-legend" id="t2legend"></span>
          <div class="cap-rule"></div>
          <span class="cap-champ" id="t2champ"></span>
        </div>
        <div class="orn"></div>
      </div>
      <div class="score" id="tscore">0</div>
    </div>

    <!-- Bottom bar: team 2 (the P2 side), the same cluster hanging upward. -->
    <div class="bar bottom" id="bbar">
      <div class="bar-bg">
        <div class="ground">
          <div class="g-fill"></div><div class="g-image"></div>
          <div class="g-shards"></div><div class="g-shade"></div><div class="g-glint"></div>
          <div class="g-grain"></div><div class="g-dim"></div>
        </div>
        <div class="rule"></div>
      </div>
      <span class="pname p1" id="b1name"></span>
      <span class="pname p2" id="b2name"></span>

      <div class="tile a">
        <img class="art hidden" id="b1legendImg" alt="" draggable="false">
        <div class="tile-cap">
          <span class="cap-legend" id="b1legend"></span>
          <div class="cap-rule"></div>
          <span class="cap-champ" id="b1champ"></span>
        </div>
        <div class="orn"></div>
      </div>
      <div class="cam" id="bcam">
        <div class="cam-fill"></div>
        <div class="hero-slot">
          <img class="art hidden" id="b1hero" alt="" draggable="false">
          <div class="cam-chip" id="b1chip"></div>
        </div>
        <div class="hero-slot">
          <img class="art hidden" id="b2hero" alt="" draggable="false">
          <div class="cam-chip" id="b2chip"></div>
        </div>
      </div>
      <div class="cam-edge"></div>
      <div class="tile b">
        <img class="art hidden" id="b2legendImg" alt="" draggable="false">
        <div class="tile-cap">
          <span class="cap-legend" id="b2legend"></span>
          <div class="cap-rule"></div>
          <span class="cap-champ" id="b2champ"></span>
        </div>
        <div class="orn"></div>
      </div>
      <div class="score" id="bscore">0</div>
    </div>

  </div>
  <div class="stage-diag" id="diag">Sideways Studio: waiting for the control panel server…</div>
  <div class="stage-diag" id="hiddenHint">The 2v2 bars overlay is hidden: switch it on and press TAKE in the control panel. (This hint never appears on the transparent broadcast URL.)</div>
</div>
<script type="module" src="./scene.js"></script>
</body>
</html>
