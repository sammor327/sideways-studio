<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sideways Studio: Sideboard Card Spotted</title>
<link rel="icon" href="/assets/favicon.ico">
<link rel="stylesheet" href="/assets/brand.css">
<link rel="stylesheet" href="/theme/fonts.css">
<link rel="stylesheet" href="/stage/stage.css">
<link rel="stylesheet" href="/stage/ground.css">
<link rel="stylesheet" href="./scene.css">
</head>
<body>
<div class="stage">
  <div class="ss off" id="root">
    <div class="spot from-right" id="spot">
      <div class="lift" id="lift">
        <div class="halo"></div>
        <div class="frame">
          <div class="card-box">
            <div class="miss" id="cardMiss"></div>
            <img class="art hidden" id="cardArt" alt="" draggable="false">
            <div class="sweep"></div>
          </div>
        </div>
        <div class="plate">
          <div class="ground">
            <div class="g-fill"></div><div class="g-image"></div>
            <div class="g-shards"></div><div class="g-shade"></div><div class="g-glint"></div>
            <div class="g-grain"></div><div class="g-dim"></div>
          </div>
          <span class="lead">Sideboard Card for</span>
          <span class="who" id="who"></span>
        </div>
      </div>
    </div>
  </div>
  <div class="stage-diag" id="diag">Sideways Studio: waiting for the control panel server…</div>
  <div class="stage-diag" id="hiddenHint">Sideboard card spotted is hidden: switch it on and press TAKE in the control panel, and it flies each spotted card in by itself. (This hint never appears on the transparent broadcast URL.)</div>
</div>
<script type="module" src="./scene.js"></script>
</body>
</html>
