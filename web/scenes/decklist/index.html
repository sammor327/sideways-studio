<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sideways Studio: Decklist</title>
<link rel="stylesheet" href="/assets/brand.css">

<link rel="stylesheet" href="/stage/stage.css">

</head>
<body>
<div class="stage">
  <div class="deck off" id="deck">
