<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sideways Studio: Hand Fan</title>
<link rel="icon" href="/assets/favicon.ico">
<link rel="stylesheet" href="/assets/brand.css">
<link rel="stylesheet" href="/theme/fonts.css">
<link rel="stylesheet" href="/stage/stage.css">
<link rel="stylesheet" href="./scene.css">
</head>
<body>
<div class="stage">
  <div class="fanscene off" id="root">
    <div class="pill" id="pill"><span class="dot"></span><span class="t">Showdown</span><span class="label">Reactions live</span></div>

    <div class="toplabel label" id="topLabel"></div>
    <div class="topfan" id="topfan"></div>

    <div class="tag l" id="tagL">
      <div class="who"><span class="chip" id="country"></span><span class="name" id="name"></span></div>
      <div class="legend"><span class="runes" id="runes"></span><span class="label" id="legend"></span></div>
      <div class="who"><span class="count" id="count">0</span><span class="label" id="countLabel"></span></div>
    </div>

    <div class="fan" id="fan"></div>

    <div class="tag r">
      <div class="who"><span class="label">Round clock</span><span class="name clock" id="clock">00:00</span></div>
      <div class="legend"><span class="label" id="round"></span></div>
    </div>
  </div>
  <div class="stage-diag" id="diag">Sideways Studio: waiting for the control panel server…</div>
  <div class="stage-diag" id="hiddenHint">The hand fan is hidden: switch it on and press TAKE in the control panel. (This hint never appears on the transparent broadcast URL.)</div>
</div>
<script type="module" src="./scene.js"></script>
</body>
</html>
