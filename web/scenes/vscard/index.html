<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sideways Studio: Head to head, VS</title>
<link rel="icon" href="/assets/favicon.ico">
<link rel="stylesheet" href="/assets/brand.css">
<link rel="stylesheet" href="/theme/fonts.css">
<link rel="stylesheet" href="/stage/stage.css">
<link rel="stylesheet" href="/stage/ground.css">
<link rel="stylesheet" href="./scene.css">
</head>
<body>
<div class="stage">
  <div class="vsc off" id="root">
    <div class="ground">
      <div class="g-fill"></div><div class="g-image"></div>
      <div class="g-shards"></div><div class="g-shade"></div><div class="g-glint"></div>
      <div class="g-grain"></div><div class="g-dim"></div>
    </div>
    <div class="card l"><img class="art hidden" id="lcard" alt="" draggable="false"><div class="blank" id="lblank"><span id="lblankText"></span></div></div>
    <div class="card r"><img class="art hidden" id="rcard" alt="" draggable="false"><div class="blank" id="rblank"><span id="rblankText"></span></div></div>
    <div class="name r"><span class="n" id="rname"></span></div>
    <div class="name l"><span class="n" id="lname"></span></div>
    <img class="glyph" src="./vs.webp" alt="" draggable="false">
    <div class="logo"><img class="hidden" id="logo" alt="" draggable="false"></div>
    <div class="round" id="round"></div>
    <div class="event" id="eventName"></div>
  </div>
  <div class="stage-diag" id="diag">Sideways Studio: waiting for the control panel server…</div>
  <div class="stage-diag" id="hiddenHint">The VS head to head is hidden: switch it on and press TAKE in the control panel. (This hint never appears on the transparent broadcast URL.)</div>
</div>
<script type="module" src="./scene.js"></script>
</body>
</html>
