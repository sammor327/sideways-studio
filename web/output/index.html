<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sideways Studio: Combined Output</title>
<link rel="icon" href="/assets/favicon.ico">
<style>
/* Combined broadcast output: every graphic in ONE transparent browser
   source (one Chromium instance instead of one per scene). Each scene keeps
   its own sync client and toggles independently from the panel.
   ?popupside=left mirrors the card popup (URL owns presentation). */
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  background: transparent;
}
</style>
</head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const popupSide = q.get('popupside') === 'left' ? '&side=left' : '';
  const anim = q.get('anim') === '0' ? '&anim=0' : '';
  // POV and the IGOs at the bottom of the stack, popup above them, score bug
  // on top. The game intro, the sideboard fly-in and the sideboard card
  // spotted sit under the in-game overlays (Sam, 2026-09-18): they play in
  // the game window, underneath.
  const SCENES = [
    `/scenes/slate/?transparent=1${anim}`,
    `/scenes/bracket/?transparent=1${anim}`,
    `/scenes/standings/?transparent=1${anim}`,
    `/scenes/legendstats/?transparent=1${anim}`,
    `/scenes/matrix/?transparent=1${anim}`,
    `/scenes/pairings/?transparent=1${anim}`,
    `/scenes/ongoing/?transparent=1${anim}`,
    `/scenes/headtohead/?transparent=1${anim}`,
    `/scenes/vscard/?transparent=1${anim}`,
    `/scenes/profile/?transparent=1${anim}`,
    `/scenes/champion/?transparent=1${anim}`,
    `/scenes/matchwin/?transparent=1${anim}`,
    `/scenes/gamewin/?transparent=1${anim}`,
    `/scenes/matchup/?transparent=1${anim}`,
    `/scenes/sideboard/?transparent=1${anim}`,
    `/scenes/sidespot/?transparent=1${anim}`,
    `/scenes/pov/?transparent=1${anim}`,
    `/scenes/decklist/?transparent=1${anim}`,
    `/scenes/decklists/?transparent=1${anim}`,
    `/scenes/igo1v1/?transparent=1${anim}`,
    `/scenes/igo2v2/?transparent=1${anim}`,
    `/scenes/igodual/?transparent=1${anim}`,
    `/scenes/igobars/?transparent=1${anim}`,
    `/scenes/igoportrait/?transparent=1${anim}`,
    `/scenes/igorows/?transparent=1${anim}`,
    `/scenes/handfan/?transparent=1${anim}`,
    `/scenes/showdown/?transparent=1${anim}`,
    `/scenes/odds/?transparent=1${anim}`,
    `/scenes/trash/?transparent=1${anim}`,
    `/scenes/lowerthird/?transparent=1${anim}`,
    `/scenes/result/?transparent=1${anim}`,
    `/scenes/cornertag/?transparent=1${anim}`,
    `/scenes/ticker/?transparent=1${anim}`,
    `/scenes/cardrow/?transparent=1${anim}`,
    `/scenes/cardpopup/?transparent=1${popupSide}${anim}`,
    `/scenes/scorebug/?transparent=1${anim}`,
    `/scenes/arenabug/?transparent=1${anim}`,
    `/scenes/sponsor/?transparent=1${anim}`,
  ];
  for (const src of SCENES) {
    const f = document.createElement('iframe');
    f.src = src;
    f.setAttribute('allowtransparency', 'true');
    document.body.appendChild(f);
  }
</script>
</body>
</html>
